services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/bazarhub
      JWT_SECRET: replace_this_with_a_strong_secret
      FRONTEND_ORIGIN: http://localhost:5000
    depends_on:
      - mongo

volumes:
  mongo_data: